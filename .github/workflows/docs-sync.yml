name: Validate cookbooks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "notebooks/**"
      - "markdowns/**"
      - "visuals/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/docs-sync.yml"
  push:
    branches:
      - main
    paths:
      - "notebooks/**"
      - "markdowns/**"
      - "visuals/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/docs-sync.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Validate changed cookbooks
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate.py --base ${{ github.event.pull_request.base.sha }}

      - name: Validate all cookbooks
        if: github.event_name == 'push'
        run: python3 scripts/validate.py --all

  publish-docs-preview:
    name: Publish Mintlify preview branch
    runs-on: ubuntu-latest
    needs: validate
    # Same-repo PRs only — fork PRs skip preview (manual dispatch comes later).
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Clone docs repository
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          DOCS_PREVIEW_BRANCH: ${{ vars.DOCS_PREVIEW_BRANCH }}
        run: |
          if [ -z "$DOCS_PREVIEW_BRANCH" ]; then
            echo "Repository variable DOCS_PREVIEW_BRANCH is not set." >&2
            exit 1
          fi
          git clone --depth=1 --branch "$DOCS_PREVIEW_BRANCH" \
            "https://x-access-token:${DOCS_REPO_TOKEN}@github.com/PriorLabs/docs.git" \
            /tmp/docs

      - name: Materialize PR cookbooks onto docs preview branch
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          python3 scripts/publish_docs_preview.py \
            --docs-dir /tmp/docs \
            --base-branch "${{ vars.DOCS_PREVIEW_BRANCH }}" \
            --preview-branch "cookbook/pr-${{ github.event.pull_request.number }}" \
            --markdowns-dir markdowns \
            --cookbooks-repo "${{ github.event.pull_request.head.repo.full_name }}" \
            --cookbooks-ref "${{ github.event.pull_request.head.ref }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --force-push

      - name: Trigger Mintlify preview deployment
        id: mintlify_preview
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PROJECT_ID: ${{ secrets.MINTLIFY_PROJECT_ID }}
          PREVIEW_BRANCH: cookbook/pr-${{ github.event.pull_request.number }}
        run: |
          response="$(curl --fail-with-body -sS -X POST \
            "https://api.mintlify.com/v1/project/preview/${MINTLIFY_PROJECT_ID}" \
            -H "Authorization: Bearer ${MINTLIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":\"${PREVIEW_BRANCH}\"}")"
          echo "$response"
          preview_url="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("previewUrl") or "")' <<<"$response")"
          if [ -z "$preview_url" ]; then
            echo "Mintlify response did not include previewUrl." >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment Mintlify preview link on PR
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.mintlify_preview.outputs.preview_url }}
          PREVIEW_BRANCH: cookbook/pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(printf '%s\n' \
            '### Docs preview' \
            '' \
            "Preview URL: ${PREVIEW_URL}" \
            '' \
            "This preview redeploys automatically when you push to this PR (\`${PREVIEW_BRANCH}\` on \`PriorLabs/docs\`).")"
          gh pr comment "$PR_NUMBER" --body "$body"

  publish-docs:
    name: Open docs PR to publish cookbooks
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only open/update a docs sync PR when this push actually changed markdowns/.
      # Script/CI-only pushes should not create docs PRs.
      - name: Check whether markdowns/ changed
        id: markdowns
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable before SHA; treating markdowns as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only --quiet "$before" "${{ github.sha }}" -- markdowns/; then
            echo "No changes under markdowns/; skipping docs sync PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "markdowns/ changed in this push."
            git diff --name-only "$before" "${{ github.sha }}" -- markdowns/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.markdowns.outputs.changed == 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        if: steps.markdowns.outputs.changed == 'true'
        with:
          node-version: "20"

      # Map this main push back to the merged cookbook PR so the docs head
      # branch can be named cookbook/update-<pr-number>.
      - name: Resolve merged PR number
        id: merged_pr
        if: steps.markdowns.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            # Fallback for merge commits: "Merge pull request #12 from ..."
            pr_number="$(git log -1 --pretty=%B "${{ github.sha }}" \
              | sed -nE 's/.*Merge pull request #([0-9]+).*/\1/p' \
              | head -1)"
          fi
          if [ -z "$pr_number" ]; then
            echo "Could not resolve a merged PR number for ${{ github.sha }}." >&2
            exit 1
          fi
          echo "Merged cookbook PR: #$pr_number"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Clone docs target branch
        if: steps.markdowns.outputs.changed == 'true'
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          DOCS_PREVIEW_BRANCH: ${{ vars.DOCS_PREVIEW_BRANCH }}
        run: |
          if [ -z "$DOCS_PREVIEW_BRANCH" ]; then
            echo "Repository variable DOCS_PREVIEW_BRANCH is not set." >&2
            exit 1
          fi
          git clone --depth=1 --branch "$DOCS_PREVIEW_BRANCH" \
            "https://x-access-token:${DOCS_REPO_TOKEN}@github.com/PriorLabs/docs.git" \
            /tmp/docs

      # Materialize cookbooks onto cookbook/update-<pr> and open/reuse a PR into
      # DOCS_PREVIEW_BRANCH (tuana/cookbooks-poc for now; set to main at go-live).
      # If the result already matches the docs base (e.g. a revert), closes any
      # stale open sync PR instead of leaving an outdated diff open.
      - name: Open docs PR with main cookbooks
        if: steps.markdowns.outputs.changed == 'true'
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          python3 scripts/publish_docs_preview.py \
            --docs-dir /tmp/docs \
            --base-branch "${{ vars.DOCS_PREVIEW_BRANCH }}" \
            --preview-branch "cookbook/update-${{ steps.merged_pr.outputs.number }}" \
            --markdowns-dir markdowns \
            --cookbooks-repo "${{ github.repository }}" \
            --cookbooks-ref main \
            --pr-number "${{ steps.merged_pr.outputs.number }}" \
            --open-pr

  cleanup-docs-preview:
    name: Delete cookbook PR preview branch
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete docs preview branch
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          PREVIEW_BRANCH: cookbook/pr-${{ github.event.pull_request.number }}
        run: |
          git clone --depth=1 --branch main \
            "https://x-access-token:${DOCS_REPO_TOKEN}@github.com/PriorLabs/docs.git" \
            /tmp/docs
          cd /tmp/docs
          git push origin --delete "$PREVIEW_BRANCH" || echo "Preview branch already deleted."
